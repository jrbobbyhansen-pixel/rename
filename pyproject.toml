[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rename"
version = "1.0.0"
description = "Bulk file rename utility with dry-run mode"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
rename = "rename:main"
